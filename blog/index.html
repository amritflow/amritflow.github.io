<style>
  :root {
    --paper: #FAFAF8;
    --ink: #1A1A1A;
    --ink-soft: #4A4A4A;
    --ink-mute: #808080;
    --rule: #E5E5E0;
    --teal: #00A896;
    --violet: #9D4EDD;
  }
  html { scroll-behavior: smooth; }
  body {
    background: var(--paper);
    color: var(--ink);
    font-family: 'Inter', sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .mono { font-family: 'JetBrains Mono', monospace; }
  .site-header {
    background: rgba(250,250,248,0.94);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--rule);
  }
  .nav-link { color: #334155; }
  .nav-link:hover { color: var(--ink); }
  .nav-link.active { color: var(--ink); font-weight: 600; }
  .brand-wordmark { color: var(--ink); }
  .brand-sublabel { color: var(--ink-mute); }
  .card {
    background: #FFFFFF;
    border: 1px solid var(--rule);
    border-radius: 14px;
    overflow: hidden;
    transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
  }
  .card:hover {
    transform: translateY(-2px);
    border-color: #D4D4CE;
    box-shadow: 0 12px 32px -16px rgba(0,0,0,0.12);
  }
  .card-img {
    aspect-ratio: 16 / 9;
    background: linear-gradient(135deg, #00A896 0%, #9D4EDD 100%);
    position: relative;
    overflow: hidden;
  }
  .card-img img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .card-img-fallback {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: rgba(255,255,255,0.7);
  }
  .tag {
    display: inline-block;
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    padding: 3px 8px;
    border-radius: 999px;
    background: #F0F0EB;
    color: var(--ink-soft);
  }
  .tag-pillar {
    background: rgba(0,168,150,0.1);
    color: #0F766E;
    font-weight: 600;
  }
  .tag-essay {
    background: rgba(157,78,221,0.08);
    color: #6B21A8;
    font-weight: 600;
  }
  .section-head {
    display: flex; align-items: baseline; justify-content: space-between;
    padding-bottom: 14px;
    border-bottom: 1px solid var(--rule);
    margin-bottom: 24px;
  }
  .section-head h2 { font-size: 22px; font-weight: 700; letter-spacing: -0.01em; }
  .section-head p { font-size: 13px; color: var(--ink-mute); max-width: 480px; }
  .empty-state {
    padding: 60px 20px;
    text-align: center;
    color: var(--ink-mute);
    font-size: 14px;
    border: 1px dashed var(--rule);
    border-radius: 14px;
  }
  footer { border-top: 1px solid var(--rule); color: var(--ink-mute); font-size: 12px; }
  .pillar-badge {
    display: inline-block;
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    padding: 4px 10px;
    border-radius: 6px;
    background: linear-gradient(90deg, rgba(0,168,150,0.12), rgba(157,78,221,0.12));
    color: #6B21A8;
    margin-bottom: 8px;
  }
</style>
</head>
